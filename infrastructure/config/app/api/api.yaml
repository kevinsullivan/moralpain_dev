stack_name: moralpain-api

template:
  type: sam
  path: templates/api.yaml
  artifact_bucket_name: !stack_attr template_bucket_name
  build_args:
    base-dir: ../code

# The SAM template references Lambda execution role ARNs as hardcoded
# strings (e.g. arn:aws:iam::${AWS::AccountId}:role/lambda_submit_survey_role)
# rather than via !stack_output, so sceptre cannot infer the dependency.
# These must be declared explicitly so the roles exist before the Lambdas
# try to assume them.
dependencies:
  - app/iam/roles/lambda-submit-survey-role.yaml
  - app/iam/roles/lambda-submit-visited-resources-role.yaml
